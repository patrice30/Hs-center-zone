<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Center - Portail Wi-Fi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        .logo { max-width: 120px; height: auto; margin-bottom: 15px; }
        .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #007bff; color: white; border: none; padding: 12px 15px; margin: 10px 0; border-radius: 5px; font-size: 16px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #0056b3; }
        .operators { display: flex; gap: 5px; align-items: center; }
        .operators img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo de HS Center -->
    <img src="logo.png" alt="HS Center Logo" class="logo">
    
    <h2>HS Center Wi-Fi</h2>
    <p>Choisissez votre forfait pour vous connecter :</p>

    <!-- Boutons de paiement avec les logos des 4 opérateurs -->
    <button class="btn" onclick="payer('200')">
        <span>Pass 24h (200 FCFA)</span>
        <div class="operators">
            <img src="orange.png" alt="Orange">
            <img src="mtn.png" alt="MTN">
            <img src="moov.png" alt="Moov">
            <img src="wave.png" alt="Wave">
        </div>
    </button>

    <button class="btn" onclick="payer('500')">
        <span>Pass 1 Semaine (500 FCFA)</span>
        <div class="operators">
            <img src="orange.png" alt="Orange">
            <img src="mtn.png" alt="MTN">
            <img src="moov.png" alt="Moov">
            <img src="wave.png" alt="Wave">
        </div>
    </button>

    <button class="btn" onclick="payer('1000')">
        <span>Pass 10 Jours (1000 FCFA)</span>
        <div class="operators">
            <img src="orange.png" alt="Orange">
            <img src="mtn.png" alt="MTN">
            <img src="moov.png" alt="Moov">
            <img src="wave.png" alt="Wave">
        </div>
    </button>

    <button class="btn" onclick="payer('3000')">
        <span>Pass Mensuel Mobile (3000 FCFA)</span>
        <div class="operators">
            <img src="orange.png" alt="Orange">
            <img src="mtn.png" alt="MTN">
            <img src="moov.png" alt="Moov">
            <img src="wave.png" alt="Wave">
        </div>
    </button>

    <button class="btn" onclick="payer('5000')">
        <span>Pass Mensuel PC/TV (5000 FCFA)</span>
        <div class="operators">
            <img src="orange.png" alt="Orange">
            <img src="mtn.png" alt="MTN">
            <img src="moov.png" alt="Moov">
            <img src="wave.png" alt="Wave">
        </div>
    </button>
</div>

<script>
    function payer(montant) {
        var liensMoneroo = {
            '200': 'https://link.moneroo.io/p/VOTRE_LIEN_200',
            '500': 'https://link.moneroo.io/p/VOTRE_LIEN_500',
            '1000': 'https://link.moneroo.io/p/VOTRE_LIEN_1000',
            '3000': 'https://link.moneroo.io/p/VOTRE_LIEN_3000',
            '5000': 'https://link.moneroo.io/p/VOTRE_LIEN_5000'
        };

        if (liensMoneroo[montant]) {
            window.location.href = liensMoneroo[montant];
        } else {
            alert("Erreur de redirection vers le paiement.");
        }
    }
</script>

</body>
</html>
