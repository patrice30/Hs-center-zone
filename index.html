<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Center - Portail Wi-Fi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; background: #007bff; color: white; border: none; padding: 12px 15px; margin: 10px 0; border-radius: 5px; font-size: 15px; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn:hover { background: #0056b3; }
        .operators { display: flex; gap: 4px; align-items: center; }
        .op-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: white; }
        .orange { background-color: #ff6600; }
        .mtn { background-color: #ffcc00; color: #000; }
        .moov { background-color: #008751; }
        .wave { background-color: #1dc2ff; }
        .btn-connect { background-color: #28a745; justify-content: center; font-weight: bold; margin-top: 20px; }
        .btn-connect:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>HS Center Wi-Fi</h2>
    <p>Choisissez votre forfait pour vous connecter :</p>

    <button class="btn" onclick="payer('200')">
        <span>Pass 24h (200 FCFA)</span>
        <div class="operators">
            <div class="op-badge orange">O</div>
            <div class="op-badge mtn">MTN</div>
            <div class="op-badge moov">M</div>
            <div class="op-badge wave">W</div>
        </div>
    </button>

    <button class="btn" onclick="payer('500')">
        <span>Pass 1 Semaine (500 FCFA)</span>
        <div class="operators">
            <div class="op-badge orange">O</div>
            <div class="op-badge mtn">MTN</div>
            <div class="op-badge moov">M</div>
            <div class="op-badge wave">W</div>
        </div>
    </button>

    <button class="btn" onclick="payer('1000')">
        <span>Pass 10 Jours (1000 FCFA)</span>
        <div class="operators">
            <div class="op-badge orange">O</div>
            <div class="op-badge mtn">MTN</div>
            <div class="op-badge moov">M</div>
            <div class="op-badge wave">W</div>
        </div>
    </button>

    <button class="btn" onclick="payer('3000')">
        <span>Pass Mensuel Mobile (3000 FCFA)</span>
        <div class="operators">
            <div class="op-badge orange">O</div>
            <div class="op-badge mtn">MTN</div>
            <div class="op-badge moov">M</div>
            <div class="op-badge wave">W</div>
        </div>
    </button>

    <button class="btn" onclick="payer('5000')">
        <span>Pass Mensuel PC/TV (5000 FCFA)</span>
        <div class="operators">
            <div class="op-badge orange">O</div>
            <div class="op-badge mtn">MTN</div>
            <div class="op-badge moov">M</div>
            <div class="op-badge wave">W</div>
        </div>
    </button>

    <a href="#" class="btn btn-connect">Déjà un code ? Se connecter</a>
</div>

<script>
    function payer(montant) {
        var liensMoneroo = {
            '200': 'VOTRE_LIEN_MONEROO_200',
            '500': 'VOTRE_LIEN_MONEROO_500',
            '1000': 'VOTRE_LIEN_MONEROO_1000',
            '3000': 'VOTRE_LIEN_MONEROO_3000',
            '5000': 'VOTRE_LIEN_MONEROO_5000'
        };

        if (liensMoneroo[montant]) {
            window.location.href = liensMoneroo[montant];
        } else {
            alert("Erreur de redirection vers le paiement.");
        }
    }
</script>

</body>
</html>
